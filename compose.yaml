name: gn-ticketing

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketdb
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: over the network, not the local socket. While the image sets up
      # a new database it answers on the socket only, and the API, which creates a
      # user when it starts, must not start until the database answers on the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ticket -d ticketdb"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The embedding service: it turns text into embeddings for the API's ticket search.
  # The model is inside the image, so it needs no key. It has no port of its own; only
  # the API calls it.
  embedder:
    build: ./embedder

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_started
    environment:
      ConnectionStrings__TicketDb: Host=db;Port=5432;Database=ticketdb;Username=ticket;Password=ticket
      # Inside the compose network the embedding service is reached by its service name.
      Embedder__Url: http://embedder:8000
      # The user the API creates when it starts, if it does not exist. demo/demo is a
      # local default, like the database password above. It is only asked for when the
      # web interface runs with SITE_PRIVATE=on.
      SeedUser__Username: ${WEB_LOGIN_USER:-demo}
      SeedUser__Password: ${WEB_LOGIN_PASSWORD:-demo}
    ports:
      - "${API_PORT:-8080}:8080"

  # The agent: the graph behind an HTTP server (agent/server.py). It has no port of its
  # own; the browser reaches it through web. The evals and the checks run in the same
  # image:  docker compose run --rm agent python evals/run.py
  agent:
    build: ./agent
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      # Inside the compose network the API is reached by its service name.
      TICKET_API_URL: http://api:8080
      # The conversations are stored in the same database as the tickets.
      DATABASE_URL: postgresql://ticket:ticket@db:5432/ticketdb
      # The values come from the .env file next to this file (see .env.example).
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      # Optional: a local model served by Ollama, in place of Azure OpenAI.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    # Lets the container reach a program on the machine it runs on, such as Ollama,
    # under the name host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The web interface: nginx with the built Angular app. It is the only way to the
  # agent from outside, and it passes the API paths on to the two services above.
  web:
    build: ./web
    depends_on:
      - api
      - agent
    environment:
      # Open locally. "on" asks for a login, and the API checks it against the users
      # in the database (demo/demo locally). The deployed site runs with "on".
      SITE_PRIVATE: ${SITE_PRIVATE:-off}
    ports:
      - "${WEB_PORT:-8081}:80"

  # Tests of the API over HTTP. They are run on request (the profile keeps them out of
  # "docker compose up"):
  #   docker compose run --rm tests
  tests:
    build: ./tests
    profiles: ["tests"]
    depends_on:
      - api
    environment:
      TICKET_API_URL: http://api:8080
      # The same login as the API creates above.
      WEB_LOGIN_USER: ${WEB_LOGIN_USER:-demo}
      WEB_LOGIN_PASSWORD: ${WEB_LOGIN_PASSWORD:-demo}

volumes:
  pgdata:
