# Open mode. Included in the server block when SITE_PRIVATE=off, which is the default
# in the Dockerfile: a local run should not ask for a password.
#
# Nobody logs in, so there is no user name to pass on to the chat.
#
# The file exists so that "include" always points at a file. A misspelt SITE_PRIVATE
# makes nginx refuse to start instead of quietly serving the site without a password.

set $auth_user "";
