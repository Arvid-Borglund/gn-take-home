# Protected mode. Included in the server block when SITE_PRIVATE=on.
#
# Basic auth on everything: the app, the chat and the ticket API. The password file is
# written by 40-htpasswd.sh when the container starts.

auth_basic           "Ticket desk";
auth_basic_user_file /etc/nginx/private/htpasswd;

# Keeps the site out of search engines, also if a link to it leaks.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
