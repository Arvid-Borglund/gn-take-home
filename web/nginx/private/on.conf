# Protected mode. Included in the server block when SITE_PRIVATE=on.
#
# A login on everything: the app, the chat and the ticket API. nginx does not know the
# users itself. Before it serves a request it asks the ticket API, through the location
# /_auth in default.conf.template, and the API checks the user name and the password in
# the request against the users in the database:
#
#   200  the request goes on, and $auth_user holds the user name the API answered with
#   401  the browser gets 401 and shows its login dialog

auth_request     /_auth;
auth_request_set $auth_user $upstream_http_x_user;

# Keeps the site out of search engines, also if a link to it leaks.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
