# Kamal configuration for the agent server (agent/server.py: FastAPI around the graph).
#
# Used by .github/workflows/deploy.yml:
#   kamal deploy -c config/deploy.agent.yml --skip-push --version <commit sha>
#
# The language model does not run here. The agent calls Ollama at
# host.docker.internal:11434, which is the server's Docker bridge. A machine with a
# GPU keeps a reverse SSH tunnel open to that address, so the model itself runs on that
# machine. If the tunnel is down, the chat answers with the model's error and the rest
# of the system works as before. Without the two OLLAMA settings below, the agent uses
# the Azure OpenAI deployment instead.
#
# It is not behind kamal-proxy and has no address of its own: the web container's nginx
# passes
# /api/chat/ on to it by its network alias. The chat is therefore only reachable
# through the web interface's login. That matters here, because every message costs a
# call to the language model with the key below.

service: ticketing-agent

image: arvid-borglund/gn-take-home/agent

servers:
  web:
    hosts:
      - 135.181.92.165
    options:
      network-alias: ticketing-agent
      # The agent server, the MCP server and the embedding model of the ticket search.
      memory: 1g
      # host.docker.internal is the server itself, as seen from the container: the
      # address the tunnel to the model listens on.
      add-host: host.docker.internal:host-gateway
    proxy: false

registry:
  server: ghcr.io
  username: arvid-borglund
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: root

env:
  clear:
    # The ticket API by its network alias (config/deploy.yml).
    TICKET_API_URL: http://ticketing-api:8080
    AZURE_OPENAI_ENDPOINT: https://external-api.openai.azure.com/
    AZURE_OPENAI_DEPLOYMENT: gpt-6-luna-c1
    AZURE_OPENAI_API_VERSION: 2024-12-01-preview
    # The model the deployed agent uses: Qwen, served by Ollama on the machine at the
    # other end of the tunnel.
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    OLLAMA_MODEL: "qwen3.6:27b"
  secret:
    - AZURE_OPENAI_API_KEY
    # Where the conversations are stored: the same PostgreSQL as the tickets. It holds
    # the database password, so it is put together in .kamal/secrets.
    - DATABASE_URL
