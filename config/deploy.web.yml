# Kamal configuration for the web interface (nginx with the built Angular app).
#
# Used by .github/workflows/deploy.yml:
#   kamal deploy -c config/deploy.web.yml --skip-push --version <commit sha>
#
# This is the only service behind kamal-proxy, and so the only way in from outside.
# The proxy terminates TLS; nginx asks for the login (SITE_PRIVATE) and passes the
# API paths on to the ticket API and the agent server, which have no address of their
# own. Everything a visitor can reach is therefore behind the same login. nginx does
# not know the users: it asks the ticket API, which checks them in the database.

service: ticketing-web

# Without the registry address: Kamal puts registry.server in front of it.
image: arvid-borglund/gn-take-home/web

servers:
  web:
    hosts:
      - 135.181.92.165
    options:
      memory: 64m

proxy:
  ssl: true
  hosts:
    - lundona.com
    - www.lundona.com
  app_port: 80
  # /up in nginx answers 200 without a login. The pages behind the login would
  # answer the proxy's check with 401, and the deploy would never go through.
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: arvid-borglund
  password:
    - KAMAL_REGISTRY_PASSWORD

# Required by Kamal's validation. Nothing is built from here (--skip-push).
builder:
  arch: amd64

ssh:
  user: root

env:
  clear:
    # In quotes on purpose: an unquoted on is the boolean true in YAML, and nginx
    # would look for private/true.conf, which does not exist.
    SITE_PRIVATE: "on"
    # The names the other two containers have on Docker's network on the server
    # (network-alias in config/deploy.yml and config/deploy.agent.yml).
    API_HOST: ticketing-api
    AGENT_HOST: ticketing-agent
