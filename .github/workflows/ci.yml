# Runs on every pull request and on every push to main.
#
#   api        starts the database and the API with compose and runs the API tests
#   agent      builds the agent image and runs the checks that need no language model
#   terraform  checks the formatting of infra/ and validates both configurations in it
#   image      builds the API image; on main it is also pushed to GHCR
#   web-images builds the agent image and the web image; on main they are pushed too
#
# The images are built once per commit on main and tagged with the commit SHA.
# A deploy never builds anything: it points the server at those tags.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Only the two the tests need. Without the names, compose would also build and
      # start the agent and the web interface.
      - name: Start the database and the API
        run: docker compose up -d --build db api

      - name: Run the tests
        run: docker compose run --rm tests

      - name: Show the container logs if something failed
        if: failure()
        run: docker compose logs

  agent:
    name: Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build agent

      # No model call here. Everything in this workflow gives the same result every
      # time; the agent's behaviour is checked by the evals in evals.yml.
      # This step catches a missing dependency or a file that does not load.
      - name: Check that the server loads
        run: docker compose run --rm -T --no-deps agent python -c "import server"

      # Starts the MCP server, lists its tools and compares them with the direct tools.
      # Listing tools calls neither the model nor the API.
      - name: Check that the MCP server offers the same tools as the direct ones
        run: docker compose run --rm -T --no-deps agent python check_mcp.py

      # Kills the MCP server process and checks that the next tool call starts it
      # again, once. Also without the model and the API.
      - name: Check that a killed MCP server is started again
        run: docker compose run --rm -T --no-deps agent python check_mcp_restart.py

      # The next check stores its conversations in PostgreSQL, as the web server does.
      # --wait returns when the database answers.
      - name: Start the database
        run: docker compose up -d --build --wait db

      # The web server with the real graph, a scripted model and the real database:
      # a turn must run to its end when the reader hangs up, a second message during a
      # turn is refused, a conversation belongs to its user, and it is still there for
      # a new server on the same database.
      - name: Check that a turn survives a reader that hangs up, and that conversations are kept
        run: docker compose run --rm -T --no-deps agent python check_turns.py

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Check the formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      # infra/ is the Azure skeleton from the assignment. It is never applied.
      - name: Validate the Azure skeleton
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra validate

      # infra/hetzner is the server the API is deployed on. No backend here: the state
      # is not needed to check the files. The plan against the real server is made
      # by terraform.yml.
      - name: Validate the Hetzner configuration
        run: |
          terraform -chdir=infra/hetzner init -input=false -backend=false
          terraform -chdir=infra/hetzner validate

  image:
    name: API image
    needs: [api, agent, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # github.repository has capital letters in it, and image names must be lower case.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Only on main. A pull request builds the image to prove that it builds,
      # but publishes nothing, so it does not have to log in.
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          # Kamal refuses to deploy an image without a service label that matches
          # "service" in config/deploy.yml. Kamal stamps it when it builds an image
          # itself; here CI builds, so CI stamps it.
          labels: |
            service=ticketing-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The other two images a deploy needs: the agent and the web interface. Building the
  # web image is also the check that the Angular app compiles.
  web-images:
    name: Agent and web images
    needs: [api, agent, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Work out the image names
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels match "service" in config/deploy.agent.yml and config/deploy.web.yml.
      - name: Agent image
        uses: docker/build-push-action@v7
        with:
          context: ./agent
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_BASE }}/agent:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/agent:main
          labels: |
            service=ticketing-agent
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_BASE }}/web:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/web:main
          labels: |
            service=ticketing-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
